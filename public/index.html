<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋 · WebRTC P2P 联机</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="title">
    <span class="logo"><i class="b"></i><i class="w"></i></span>
    <div>
      <h1>五子棋 · P2P 联机</h1>
      <p class="subtitle">WebRTC DataChannel 直连对战 · 服务器只负责牵线，不过招棋</p>
    </div>
  </div>
  <div id="conn-badge" class="badge offline"><span class="dot"></span><span id="conn-text">未连接</span></div>
</header>

<main class="wrap">

  <section class="card board-card">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="board-overlay" class="board-overlay">
        <div class="overlay-inner">
          <div class="overlay-dots"><i></i><i></i><i></i></div>
          <p id="overlay-text">在右侧创建或加入房间，开始 P2P 对局</p>
        </div>
      </div>
      <div id="result-banner" class="result-banner hidden">
        <div class="result-dot"></div>
        <div class="result-text" id="result-text">你赢了！</div>
        <button class="btn primary" id="rematch-btn">再来一局</button>
      </div>
    </div>
    <div class="board-actions">
      <button class="btn" id="undo-btn" disabled>悔棋</button>
      <button class="btn" id="restart-btn" disabled>重新开始</button>
      <button class="btn ghost" id="sound-btn" aria-pressed="true">音效：开</button>
      <span class="spacer"></span>
      <span class="hint" id="turn-hint">等待连接…</span>
    </div>
  </section>

  <aside class="side">

    <div class="card" id="connect-card">
      <div class="tabs">
        <button class="tab active" data-tab="room">房间联机</button>
        <button class="tab" data-tab="manual">手动信令</button>
      </div>

      <div class="tab-panel" id="tab-room">
        <label class="field">
          <span>昵称</span>
          <input id="name-input" type="text" maxlength="12" placeholder="输入昵称" autocomplete="off">
        </label>
        <div class="row">
          <button class="btn primary grow" id="create-room-btn">创建房间</button>
        </div>
        <div class="divider"><span>或</span></div>
        <div class="row">
          <input id="room-input" class="room-code" type="text" maxlength="4" placeholder="房间号" autocomplete="off">
          <button class="btn grow" id="join-room-btn">加入房间</button>
        </div>
        <div id="room-info" class="room-info hidden">
          <div class="room-info-line">房间号 <b id="room-code-text"></b>
            <button class="btn tiny" id="copy-link-btn">复制邀请链接</button>
          </div>
          <div class="status-line" id="room-status">等待对手加入…</div>
        </div>
        <p class="manual-tip" id="file-tip" style="display:none">当前是 file:// 本地打开，房间联机不可用；请通过服务器访问，或切换到「手动信令」标签页。</p>
      </div>

      <div class="tab-panel hidden" id="tab-manual">
        <p class="manual-tip">没有服务器也能玩：双方通过任意聊天工具互相复制粘贴连接码，即可建立 P2P 直连。</p>
        <div class="manual-step">
          <b>① 邀请方：生成邀请码</b>
          <button class="btn small primary" id="manual-host-btn">生成邀请码</button>
        </div>
        <div class="manual-step">
          <b>② 被邀请方：粘贴邀请码，生成应答码</b>
          <textarea id="manual-in-guest" rows="3" placeholder="粘贴收到的邀请码"></textarea>
          <button class="btn small" id="manual-guest-btn">生成应答码</button>
        </div>
        <div class="manual-step">
          <b>③ 邀请方：粘贴应答码，完成连接</b>
          <textarea id="manual-in-host" rows="3" placeholder="粘贴收到的应答码"></textarea>
          <button class="btn small" id="manual-host-finish-btn">完成连接</button>
        </div>
        <div class="manual-step hidden" id="manual-out-wrap">
          <b>把下面的连接码发给对方</b>
          <textarea id="manual-out" rows="3" readonly></textarea>
          <button class="btn small" id="manual-copy-btn">复制连接码</button>
        </div>
      </div>
    </div>

    <div class="card" id="game-card">
      <div class="players">
        <div class="player" id="player-black">
          <span class="stone-dot black"></span>
          <div><b id="black-name">黑方</b><small id="black-tag">邀请方</small></div>
        </div>
        <div class="vs">VS</div>
        <div class="player" id="player-white">
          <span class="stone-dot white"></span>
          <div><b id="white-name">白方</b><small id="white-tag">加入方</small></div>
        </div>
      </div>
      <div class="stats">
        <div><small>手数</small><b id="move-count">0</b></div>
        <div><small>最后一手</small><b id="last-move">-</b></div>
        <div><small>状态</small><b id="game-state">未开始</b></div>
      </div>
    </div>

    <div class="card chat-card">
      <div class="chat-head">对局聊天</div>
      <div class="chat-list" id="chat-list"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" maxlength="100" placeholder="说点什么…" disabled autocomplete="off">
        <button class="btn small" id="chat-send-btn" disabled>发送</button>
      </div>
    </div>

  </aside>
</main>

<div class="modal-mask hidden" id="modal-mask">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn primary" id="modal-ok">同意</button>
      <button class="btn" id="modal-no">拒绝</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="game-core.js"></script>
<script src="app.js"></script>
</body>
</html>
