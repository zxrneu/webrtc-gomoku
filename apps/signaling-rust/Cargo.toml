[package]
name = "gomoku-signaling"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
description = "WebRTC Gomoku signaling + static hosting server (Rust rewrite, M3 v2.0)"
license = "MIT"
publish = false

[[bin]]
name = "gomoku-signaling"
path = "src/main.rs"

[lib]
name = "gomoku_signaling"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
axum = { version = "0.7", features = ["ws", "http1", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = "0.24"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
toml = "0.8"
arc-swap = "1.7"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }
dashmap = "6.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
prometheus = "0.13"
rand = "0.8"
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "unicode-gencat"] }
futures-util = "0.3"
bytes = "1.7"
subtle = "2.6"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["test-util", "macros", "rt-multi-thread", "time", "sync", "net", "fs"] }
axum = { version = "0.7", features = ["ws", "http1", "tokio"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1.0"
tempfile = "3"

[features]
default = []
jemalloc = ["tikv-jemallocator"]

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
